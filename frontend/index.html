<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Day Trading Console</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>Day Trading Console</h1>
    <div class="header-right">
      <div id="regime-chip" class="chip">regime: …</div>
      <div id="risk-summary" class="risk-summary">loading risk...</div>
    </div>
  </header>

  <main>
    <section class="panel" id="scanner-panel">
      <div class="panel-head">
        <h2>1. Gap &amp; Volume Scanner</h2>
        <div class="controls">
          <label>min gap %
            <input type="number" id="min-gap" value="3" step="0.5" min="0" />
          </label>
          <label>min RVOL
            <input type="number" id="min-rvol" value="2" step="0.5" min="0" />
          </label>
          <button id="run-scanner">Run</button>
        </div>
      </div>
      <table id="scanner-table">
        <thead>
          <tr>
            <th>Symbol</th><th>Price</th><th>Gap %</th><th>RVOL</th>
            <th>RS vs SPY</th><th>Pers</th><th>Liq</th><th>Spread</th>
            <th>ATR</th><th>Score</th><th>Bias</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel" id="setups-panel">
      <div class="panel-head">
        <h2>2. Setups <span id="selected-symbol" class="muted">(select a symbol)</span></h2>
      </div>
      <div id="setups-body">No symbol selected.</div>
    </section>

    <section class="panel" id="risk-panel">
      <div class="panel-head">
        <h2>3. Risk / Position Size</h2>
      </div>
      <form id="risk-form">
        <label>equity $
          <input type="number" id="equity" value="25000" step="1000" />
        </label>
        <label>risk per trade %
          <input type="number" id="risk-pct" value="1" step="0.1" min="0.1" max="5" />
        </label>
        <label>entry
          <input type="number" id="entry" step="0.01" />
        </label>
        <label>stop
          <input type="number" id="stop" step="0.01" />
        </label>
        <label>side
          <select id="side"><option value="long">long</option><option value="short">short</option></select>
        </label>
        <button type="submit">Size it</button>
      </form>
      <pre id="risk-output"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
